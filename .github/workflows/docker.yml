# Builds the service's Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/gmod-mlp-g5-web:latest      — every push to main
#   ghcr.io/<owner>/gmod-mlp-g5-web:<x.y.z>     — a tag v<x.y.z>
#   ghcr.io/<owner>/gmod-mlp-g5-web:sha-<short> — every build
# Before publishing, the image is started and /health must answer (a broken build never reaches the registry).
# Pull requests only build and test, nothing is published.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gmod-mlp-g5-web

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name (registry names are lower case)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build (for the test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mlp-g5-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test — the service starts and answers, ffmpeg and librosa are there
        run: |
          docker run -d --name mlp -p 8080:8080 mlp-g5-web:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/health
          curl -fs -o /dev/null http://127.0.0.1:8080/
          curl -fs -o /dev/null http://127.0.0.1:8080/songs
          docker exec mlp ffmpeg -version | head -1
          docker exec mlp python -c "import librosa, numpy; print('librosa', librosa.__version__)"
          docker logs mlp | tail -20
          docker rm -f mlp

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
