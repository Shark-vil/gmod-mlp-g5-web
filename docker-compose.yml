services:
  mlp-stats:
    # the image GitHub Actions builds on every push to main (.github/workflows/docker.yml):
    #   docker compose pull && docker compose up -d
    # no "build:" here on purpose: "up --build" would build the server folder's (maybe old) source over the pulled image.
    # To build from the source instead: git pull && docker build -t ghcr.io/shark-vil/gmod-mlp-g5-web:latest . && docker compose up -d
    image: ${MLP_IMAGE:-ghcr.io/shark-vil/gmod-mlp-g5-web:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MLP_PORT:-8080}:8080"
    volumes:
      - mlp-stats-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mlp-stats-data:
