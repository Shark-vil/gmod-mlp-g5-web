services:
  mlp-stats:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MLP_PORT:-8080}:8080"
    volumes:
      - mlp-stats-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mlp-stats-data:
