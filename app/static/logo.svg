<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <!-- Transparent background -->
  
  <!-- Soft outer glow -->
  <circle cx="100" cy="100" r="92" fill="#f3e8ff" opacity="0.12"/>
  
  <!-- Magical energy rings -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.35"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Central multi-pointed magical star -->
  <g>
    <!-- Main star -->
    <path d="M100 28 
             L112 72 L158 72 
             L122 98 L136 142 
             L100 116 L64 142 
             L78 98 L42 72 
             L88 72 Z" 
          fill="#fbbf24" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>
    
