<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Песни для «Танца» — Maretime Bay</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/site.css">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
<style>
  .bar2 { display: grid; grid-template-columns: 1fr 190px 210px; gap: 8px; margin-bottom: 10px; }
  @media (max-width: 640px) { .bar2 { grid-template-columns: 1fr 1fr; } .bar2 input { grid-column: 1 / -1; } }
  .ages { position: relative; }
  .ages summary { list-style: none; cursor: pointer; height: 100%; box-sizing: border-box; padding: 8px 30px 8px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .ages summary::-webkit-details-marker { display: none; }
  .ages summary::after { content: "▾"; position: absolute; right: 12px; color: var(--muted); }
  .agebox { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px; box-shadow: 0 6px 20px rgba(40, 10, 70, .18); }
  .agebox label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .agebox label:hover { background: var(--row); }
  .agebox input { width: 16px; height: 16px; margin: 0; padding: 0; flex: none; outline: none; box-shadow: none; accent-color: #c2307f; }
  .tagon { display: flex; gap: 8px; align-items: center; margin: -2px 2px 10px; font-size: 14px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tg { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--row); color: var(--text); border: 0; font: inherit; font-size: 12px; cursor: pointer; }
  .tg:hover { outline: 1px solid var(--line); }
  .gn { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #e9dcff; color: #4a2c8a; }
  .age { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #fde1c8; color: #7a3a00; }
  .age.a18 { background: #f7c9cf; color: #7d1020; }
  .ns { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #d8e6ff; color: #1d3f86; cursor: help; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ns { background: #1f3358; color: #c7dbff; } }
  :root[data-theme="dark"] .ns { background: #1f3358; color: #c7dbff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gn { background: #3b2e63; color: #d9ccff; } :root:not([data-theme="light"]) .age { background: #5a3414; color: #ffd6ad; } :root:not([data-theme="light"]) .age.a18 { background: #5c1a24; color: #ffc4cc; } }
  :root[data-theme="dark"] .gn { background: #3b2e63; color: #d9ccff; } :root[data-theme="dark"] .age { background: #5a3414; color: #ffd6ad; } :root[data-theme="dark"] .age.a18 { background: #5c1a24; color: #ffc4cc; }
  .src { font-size: 14px; margin: 6px 0; overflow-wrap: anywhere; }
  .src a { color: var(--text); }
  .song { display: grid; grid-template-columns: 56px 1fr auto; gap: 6px 12px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
  .song img.cv { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--row); grid-row: span 2; align-self: start; }
  .one .head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .one .head img { width: 120px; height: 120px; border-radius: 14px; object-fit: cover; background: var(--row); flex: none; }
  .song:first-child { border-top: 0; }
  .song .t { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .song .t a { color: var(--text); text-decoration: none; }
  .song .t a:hover { text-decoration: underline; }
  .song .sub { color: var(--muted); font-size: 13px; }
  .song .sub a { color: var(--muted); }
  .song audio { width: 100%; height: 34px; grid-column: 2 / -1; }
  .song .ws { align-self: start; }
  .one h1 { margin: 0 0 4px; font-size: 22px; }
  .one { padding: 14px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 14px; margin: 10px 0; font-size: 14px; }
  .facts div { display: flex; justify-content: space-between; gap: 8px; }
  .empty { padding: 20px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin: 10px 2px; }
  .note a { color: var(--muted); }
  .top10 h2 { font-size: 17px; margin: 14px 0 4px; }
  .top10 ol { margin: 4px 0 10px; padding-left: 22px; }
  .top10 li { padding: 3px 0; }
  .top10 a { color: var(--text); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .claim { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--muted); opacity: .45; font-size: 13px; line-height: 1; }
  .claim:hover, .claim:focus-visible { opacity: 1; }
  .claim svg { width: 14px; height: 14px; vertical-align: -2px; }
  .lg-box p { font-size: 14px; margin: 0 0 10px; }
  .lg-box .wsl { overflow-wrap: anywhere; font-weight: 600; }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <div class="top"><b><img class="logo" src="/static/logo.svg" alt="" width="26" height="26">Maretime Bay · песни</b><span id="account"></span></div>
  <nav class="links"><a href="/">Рекорды</a><a href="/songs" class="on">Песни</a><a href="/my-songs">Мои песни</a><a href="/me">Моя статистика</a><a href="/rules">Правила</a></nav>
  <div id="list">
    <div class="bar2">
      <input id="q" type="search" placeholder="Найти песню, исполнителя, автора или тег" aria-label="Поиск песен">
      <select id="genre" aria-label="Жанр"><option value="">все жанры</option></select>
      <details class="ages" id="ages" title="Песни с метками 16+ / 18+ скрыты, пока вы их не включите">
        <summary id="agesum" aria-label="Возрастные метки"></summary>
        <div class="agebox">
          <label><input type="checkbox" value="0"><span>Безопасное</span></label>
          <label><input type="checkbox" value="16"><span>16+</span></label>
          <label><input type="checkbox" value="18"><span>18+</span></label>
        </div>
      </details>
    </div>
    <div class="tagon" id="tagon" hidden><span>тег:</span><b id="tagname"></b><button class="btn" id="tagoff" title="Убрать фильтр по тегу">✕</button></div>
    <div class="card" id="rows"><div class="empty">…</div></div>
    <div style="text-align:center;margin-top:10px"><button class="btn" id="more" hidden>Показать ещё</button></div>
    <p class="note">Песни для мини-игры «Танец». Их делают игроки в редакторе (вкладка «Мои песни») и выкладывают модом в Мастерскую;
      в игре песню выбирают голосованием в лобби, мод скачивается сам. Здесь звучит только фрагмент.
      <a href="/rules">Правила песен</a>.</p>
  </div>
  <div id="one" hidden></div>
</main>
<script src="/static/site.js"></script>
<script>
const $ = id => document.getElementById(id);
function mmss(v) { v = Math.round(v || 0); return Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0"); }
function el(tag, text, cls) { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
function a(text, href, ext) { const x = el("a", text); x.href = href; if (ext) { x.target = "_blank"; x.rel = "noopener"; } return x; }
const one = location.pathname.match(/^\/songs\/([0-9a-f-]{36})$/);

let GENRES = [];
const gname = id => { const g = GENRES.find(x => x.id === id); return g ? (mlpLang() === "en" ? g.en || g.ru : g.ru) : null; };
const NS_TIP = "Нестандартная песня: в ней есть ноты ближе 0,25 с друг к другу. Автор сам снял ограничение. Такие ноты идут почти подряд: их легко перепутать, а нажатие чуть раньше времени засчитается предыдущей ноте (другая клавиша — промах). Играть труднее обычного.";
function ageBadge(age) { const b = el("span", age + "+", "age" + (age >= 18 ? " a18" : "")); b.title = tx(age >= 18 ? "18+: много мата или мат и эротический подтекст" : "16+: мат или эротический подтекст"); return b; }
function badges(s, clickable) {
  const box = el("div", null, "badges");
  if (s.age) box.appendChild(ageBadge(s.age));
  if (s.nonstandard) { const b = el("span", tx("Нестандартная"), "ns"); b.title = tx(NS_TIP); box.appendChild(b); }
  (s.genres || []).map(gname).filter(Boolean).forEach(n => box.appendChild(el("span", n, "gn")));
  (s.tags || []).forEach(t => {
    const b = el(clickable ? "button" : "a", "#" + t, "tg");
    if (clickable) { b.type = "button"; b.title = tx("Песни с тегом «{0}»", t); b.onclick = () => setTag(t); } else { b.href = "/songs?tag=" + encodeURIComponent(t); }
    box.appendChild(b);
  });
  return box;
}
function songRow(s) {
  const row = el("div", null, "song");
  const t = el("div", null, "t"); t.appendChild(a(s.title, s.page));
  const sub = el("div", null, "sub");
  [s.artist, mmss(s.len)].filter(Boolean).forEach(x => sub.append(x, " · ")); sub.append("автор", " ");
  sub.appendChild(mlpAuthor(s));
  const left = el("div"); left.append(t, sub);
  if (s.age || s.nonstandard || (s.genres || []).length || (s.tags || []).length) left.appendChild(badges(s, true));
  const ws = el("div", null, "ws");
  if (s.workshop) { const b = a("Мод в Мастерской", s.workshop, true); b.className = "btn"; ws.appendChild(b); }
  const au = el("audio"); au.controls = true; au.preload = "none"; au.src = s.preview;
  const img = el("img", null, "cv"); img.src = s.cover; img.alt = ""; img.loading = "lazy";
  row.append(img, left, ws, au);
  return row;
}

const boxes = () => [...document.querySelectorAll("#ages input")];
const ages = () => boxes().filter(c => c.checked).map(c => c.value);
function agesLabel() {
  const on = ages();
  $("agesum").textContent = !on.length ? tx("ничего не выбрано") : on.length === 3 ? tx("все песни") : on.map(v => v === "0" ? tx("Безопасное") : v + "+").join(", ");
}
let offset = 0, timer = null, tag = new URLSearchParams(location.search).get("tag") || "";
function setTag(t) {
  tag = t || ""; $("tagon").hidden = !tag; $("tagname").textContent = tag ? "#" + tag : "";
  history.replaceState(null, "", tag ? "/songs?tag=" + encodeURIComponent(tag) : "/songs");
  list(true);
}
async function list(reset) {
  if (reset) offset = 0;
  const q = $("q").value.trim();
  let res = { songs: [], total: 0 };
  const qs = `limit=30&offset=${offset}&q=${encodeURIComponent(q)}&genre=${encodeURIComponent($("genre").value)}&tag=${encodeURIComponent(tag)}&ages=${ages().join(",") || "none"}`;
  try { res = await (await fetch("/api/v1/songs?" + qs)).json(); } catch (e) {}
  const box = $("rows");
  if (reset) box.textContent = "";
  if (!res.songs.length && reset) { box.appendChild(el("div", !ages().length ? "Отметьте хотя бы одну метку: «Безопасное», 16+ или 18+" : q || tag || $("genre").value ? "Ничего не нашлось" : "Песен пока нет — загрузите первую в «Мои песни»", "empty")); }
  res.songs.forEach(s => box.appendChild(songRow(s)));
  offset += res.songs.length;
  $("more").hidden = offset >= res.total;
}

async function page(u) {
  $("list").hidden = true; $("one").hidden = false;
  const r = await fetch("/api/v1/songs/" + u);
  const box = $("one"); box.className = "card one";
  if (!r.ok) { box.textContent = "Такой песни нет (или она ещё не опубликована)."; return; }
  let s = await r.json();
  if (s.status && !s.published) { box.textContent = "Песня ещё не опубликована. "; box.appendChild(a("Открыть в редакторе", "/editor/" + u)); return; }
  if (s.status) s = s.published;   // the author / an admin got the working copy: show the published one here
  document.title = tx("{0} — песни Maretime Bay", s.title);
  const head = el("div", null, "head"); const hi = el("img"); hi.src = s.cover; hi.alt = "Обложка"; head.appendChild(hi);
  const ht = el("div"); ht.appendChild(el("h1", s.title));
  const sub = el("div", null, "note"); if (s.artist) sub.append(s.artist, " · "); sub.append("автор", " ");
  sub.appendChild(mlpAuthor(s)); ht.appendChild(sub);
  if (s.age || s.nonstandard || (s.genres || []).length || (s.tags || []).length) ht.appendChild(badges(s, false));
  head.appendChild(ht); box.appendChild(head);
  if (s.source) {
    let host = s.source; try { host = new URL(s.source).hostname; } catch (e) {}
    const p = el("div", null, "src"); p.append("Источник:", " ");
    const l = a(host, mlpAway(s.source)); l.rel = "nofollow"; l.title = s.source; p.appendChild(l); box.appendChild(p);
  }
  const au = el("audio"); au.controls = true; au.preload = "metadata"; au.src = s.preview; au.style.width = "100%"; box.appendChild(au);
  const f = el("div", null, "facts");
  const notes = s.chart ? s.chart.t.length : 0, holds = s.chart ? s.chart.large.length : 0;
  [["Длина", mmss(s.len)], ["Нот", notes], ["Удержаний", holds], ["Версия", s.version],
   ["Опубликована", s.approved_at ? new Date(s.approved_at * 1000).toLocaleDateString(mlpLocale()) : "—"]].forEach(([k, v]) => {
    const d = el("div"); d.append(el("span", k), el("b", String(v))); f.appendChild(d);
  });
  box.appendChild(f);
  if (s.workshop) { const b = a("Мод в Мастерской", s.workshop, true); b.className = "btn main"; box.appendChild(b); }
  box.appendChild(el("p", "В игре: зона «Танец» → голосование в лобби. Если мода песни у вас нет, игра скачает его сама и сверит с сайтом.", "note"));
  // the best scores on this song (from the game servers)
  const top = el("div", null, "top10"); top.appendChild(el("h2", "Рекорды песни")); box.appendChild(top);
  const lb = await (await fetch("/api/v1/leaderboard?limit=10&stat=" + encodeURIComponent(s.stat))).json().catch(() => null);
  if (!lb || !lb.rows || !lb.rows.length) top.appendChild(el("div", "Пока никто не танцевал под эту песню.", "note"));
  else {
    const ol = el("ol");
    lb.rows.forEach(r => { const li = el("li"); li.appendChild(a(r.nick || r.steamid, "https://steamcommunity.com/profiles/" + r.steamid, true)); li.append(" — ", el("b", String(Math.round(r.value))), " ", "очк."); ol.appendChild(li); });
    top.appendChild(ol);
  }
  const foot = el("div", null, "foot");
  const back = a("← Все песни", "/songs"); back.style.color = "var(--muted)"; foot.appendChild(back);
  // the rights holder's complaint: a quiet icon; gone for everybody while a complaint is being handled
  if (s.workshop && !s.claimed) {
    const c = el("button", null, "claim"); c.type = "button";
    c.title = "Сообщить о нарушении авторских прав"; c.setAttribute("aria-label", "Сообщить о нарушении авторских прав");
    c.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.3"/><path d="M10 6.2a2.6 2.6 0 1 0 0 3.6"/></svg>';
    c.onclick = () => claimDialog(u, c);
    foot.appendChild(c);
  }
  box.appendChild(foot);
}

function claimDialog(u, icon) {
  const back = el("div", null, "lg-back"), dlg = el("div", null, "lg-box");
  back.setAttribute("role", "dialog"); back.setAttribute("aria-modal", "true");
  const close = () => { back.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  const act = el("div", null, "lg-actions");
  const btn = (text, cls, fn) => { const b = el("button", text, cls); b.onclick = fn; act.appendChild(b); return b; };
  dlg.append(el("h2", "Жалоба правообладателя"),
    el("p", "Вы правообладатель трека или представляете его? Жалоба запускает проверку мода этой песни в Мастерской Steam."),
    el("p", "Отправляйте её, только если трек действительно нарушает ваши права."));
  btn("Отмена", "cancel", close);
  const go = btn("Отправить жалобу", "go", async () => {
    go.disabled = true;
    let r, j = {};
    try { r = await fetch("/api/v1/songs/" + u + "/claim", { method: "POST" }); j = await r.json().catch(() => ({})); } catch (e) {}
    if (!r || !r.ok) { go.disabled = false; act.before(el("p", tx("Не получилось: {0}", j.detail || (r ? r.status : "нет связи")), "no")); return; }
    icon.remove();
    dlg.textContent = ""; act.textContent = "";
    dlg.append(el("h2", j.already ? "Жалоба уже подана" : "Жалоба принята"),
      el("p", "Песни распространяются модами в Мастерской Steam — сайт их не раздаёт в игру. Чтобы убрать трек, подайте жалобу на мод через Steam:"));
    const l = a(j.workshop, j.workshop, true); l.className = "wsl"; const lp = el("p"); lp.appendChild(l); dlg.appendChild(lp);
    dlg.append(el("p", "На странице мода: «Пожаловаться» → нарушение авторских прав."),
      el("p", tx("Мы следим за модом до {0}. Как только Steam его уберёт, песня будет скрыта с сайта и из игры (проверка — раз в несколько часов).", new Date(j.until * 1000).toLocaleDateString(mlpLocale()))),
      el("p", "Если за это время мод не пропадёт, жалоба снимается — её нужно будет подать заново.", "no"));
    btn("Закрыть", "go", close); dlg.appendChild(act);
  });
  dlg.appendChild(act); back.appendChild(dlg); document.body.appendChild(back); go.focus();
}

async function start() {
  try { GENRES = (await (await fetch("/api/v1/genres")).json()).genres || []; } catch (e) {}
  if (one) { page(one[1]); return; }
  const fill = () => { const v = $("genre").value; $("genre").length = 1; GENRES.forEach(g => { const o = el("option", gname(g.id)); o.value = g.id; $("genre").appendChild(o); }); $("genre").value = v; };
  fill(); document.addEventListener("mlp-lang", () => { fill(); list(true); });
  // the age marks: any combination; kept as "0,16" in mlpSongsAges (the older mlpSongsAge: a single choice "16" / "18" = up to that mark)
  let saved = window.mlpStore.get("mlpSongsAges");
  if (saved == null) { const old = window.mlpStore.get("mlpSongsAge"); saved = old === "16" ? "0,16" : old === "18" ? "0,16,18" : "0"; }
  const on = saved.split(",");
  boxes().forEach(c => { c.checked = on.includes(c.value); });
  agesLabel();
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => list(true), 250); });
  $("genre").onchange = () => list(true);
  boxes().forEach(c => c.onchange = () => { window.mlpStore.set("mlpSongsAges", ages().join(",") || "none"); agesLabel(); list(true); });
  document.addEventListener("click", e => { if (!$("ages").contains(e.target)) $("ages").open = false; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("ages").open = false; });
  document.addEventListener("mlp-lang", agesLabel);
  $("tagoff").onclick = () => setTag("");
  $("more").onclick = () => list(false);
  if (tag) setTag(tag); else list(true);
}
start();
</script>
</body>
</html>
