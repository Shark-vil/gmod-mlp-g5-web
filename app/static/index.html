<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maretime Bay — рекорды</title>
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<div class="bar"></div>
<main>
  <div class="top"><b>Maretime Bay · рекорды</b><span id="account"></span></div>
  <nav class="links"><a href="/" class="on">Рекорды</a><a href="/songs">Песни</a><a href="/me">Моя статистика</a></nav>
  <div class="controls">
    <select id="cat" aria-label="Категория"></select>
    <select id="stat" aria-label="Показатель"></select>
    <input id="q" type="search" placeholder="Найти пони по нику" aria-label="Поиск по нику">
  </div>
  <div class="card"><table><tbody id="rows"></tbody></table></div>
</main>
<footer>Всё открывается только игрой. Никакого доната. Нажмите на игрока — его статистика.</footer>
<script src="/static/site.js"></script>
<script src="/static/stats.js"></script>
<script>
const MEDAL = ["🥇", "🥈", "🥉"];
const $ = id => document.getElementById(id);
const cat = $("cat"), sel = $("stat"), q = $("q"), rows = $("rows");
let data = [], cur = null, openSid = null;

const { CATS, esc, fmt, renderProfile } = window.MLPStats;

function fillStats(ci, key) {
  sel.innerHTML = CATS[ci].stats.map((s, i) => `<option value="${i}">${esc(s.label)}</option>`).join("");
  sel.value = Math.max(0, CATS[ci].stats.findIndex(s => s.key === key));
}

function render() {
  const f = q.value.trim().toLowerCase();
  const list = data.map((r, k) => ({ ...r, place: k + 1 })).filter(r => !f || String(r.nick || r.steamid).toLowerCase().includes(f));
  if (!list.length) { rows.innerHTML = `<tr><td class="empty">${data.length ? "Никого с таким ником" : "Пока пусто"}</td></tr>`; return; }
  rows.innerHTML = list.map(r => {
    const open = r.steamid === openSid;
    return `<tr class="r${open ? " open" : ""}" data-sid="${esc(r.steamid)}"><td class="n">${r.place <= 3 ? MEDAL[r.place - 1] : r.place}</td>` +
      `<td class="nick">${esc(r.nick || r.steamid)}</td><td class="v">${esc(fmt(cur, r.value))}</td></tr>` +
      (open ? `<tr class="prof"><td colspan="3" id="prof">…</td></tr>` : "");
  }).join("");
  if (openSid && $("prof")) profile(openSid);
}

async function profile(sid) {
  const box = $("prof");
  await renderProfile(sid, box, () => openSid === sid && $("prof") === box);
}

async function show() {
  cur = CATS[cat.value].stats[sel.value];
  openSid = null;
  try { history.replaceState(null, "", "#" + cur.key); } catch (e) {}
  rows.innerHTML = '<tr><td class="empty">…</td></tr>';
  try {
    data = (await (await fetch(cur.url + "&limit=100")).json()).rows || [];
    render();
  } catch (e) { data = []; rows.innerHTML = '<tr><td class="empty">Сервер статистики недоступен</td></tr>'; }
}


rows.addEventListener("click", e => {
  const tr = e.target.closest("tr.r");
  if (!tr) return;
  openSid = openSid === tr.dataset.sid ? null : tr.dataset.sid;
  render();
});
cat.innerHTML = CATS.map((c, i) => `<option value="${i}">${esc(c.label)}</option>`).join("");
cat.onchange = () => { fillStats(cat.value); show(); };
sel.onchange = show;
q.oninput = render;

// the last choice comes back from the address (#best_dance)
const want = decodeURIComponent(location.hash.slice(1));
const ci = Math.max(0, CATS.findIndex(c => c.stats.some(s => s.key === want)));
cat.value = ci;
fillStats(ci, want);
show();
</script>
</body>
</html>
